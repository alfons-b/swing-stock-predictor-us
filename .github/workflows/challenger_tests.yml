# Test model challenger dengan library sungguhan (torch CPU, statsmodels, arch), SQLite + PostgreSQL.
# Terpisah dari tests.yml: workflow produksi lama (daily/setup/retrain) tidak memasang torch dan tidak menunggu test ini.
name: Challenger Tests

on:
  push:
    paths:
      - "app/challengers/**"
      - "tests/test_challengers_*.py"
      - "config/challengers.yaml"
      - "requirements-models.txt"
      - ".github/workflows/challenger_*.yml"
      - ".github/actions/setup-challengers/**"
  pull_request:
    paths:
      - "app/challengers/**"
      - "tests/test_challengers_*.py"
      - "config/challengers.yaml"
      - "requirements-models.txt"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest-challengers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: swing_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://ci:ci@localhost:5432/swing_test
      YAHOO_ENABLED: "false"
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-challengers
      - name: pytest (challenger)
        run: |
          set -o pipefail
          pytest -q -rfEs tests/test_challengers_core.py tests/test_challengers_models.py 2>&1 | tee pytest.log || {
            grep -E "^(FAILED|ERROR) " pytest.log | head -20 | sed 's/^/::error title=pytest::/'
            exit 1
          }
          echo "::notice title=challenger tests::$(tail -1 pytest.log)"
